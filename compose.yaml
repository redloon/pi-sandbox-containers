# pi-sandbox-containers — Docker Compose fleet for sandboxed pi.
#
# Normally driven by `pis` (bin/pis), which exports the interpolation vars below:
#   SANDBOX_WORKDIR  host repo bind-mounted at /workspace (required)
#   KVM_GID          gid of /dev/kvm on the host (android service)
#   HOST_UID/HOST_GID  build-args mapping the container user to you
#   PI_VERSION       pi version baked into the images
#   DOCKER_HASH      content stamp; stale images auto-rebuild on next `pis`
#   PI_SANDBOX_ANDROID_SDK  host Android SDK, mounted read-only at
#                    /opt/android-sdk (android service only)
#   PI_SANDBOX_GIT_HOME     dir holding .gitconfig + .config/git, mounted
#                    read-only so commits carry your identity (every service)
#   PI_SANDBOX_AVD_NAME / PI_SANDBOX_ANDROID_SYSTEM_IMAGE
#                    AVD the entrypoint prepares (android service)
#
# Security posture (see docs/security.md): non-root user, cap_drop: ALL,
# no-new-privileges, no docker.sock, no published ports, outbound egress only.
# Provider credentials arrive as process env: every variable in .env is injected
# into every sandbox (the .env passthrough contract — any provider pi supports
# works with zero code changes), and host *_API_KEY / PI_SANDBOX_EXTRA_ENV vars
# are passed per exec by `pis` (compose exec -e NAME). Credentials are never
# written to disk inside a sandbox.

x-hardening: &hardening
  init: true
  restart: "no"
  cap_drop: ["ALL"]
  security_opt: ["no-new-privileges:true"]
  working_dir: /workspace
  command: ["keep-alive"]
  # The passthrough contract: every variable in .env (any provider's key, any
  # name) becomes process env in every sandbox. Long-form env_file with
  # required: false needs Docker Compose >= 2.24.
  env_file:
    - path: .env
      required: false

x-build-args: &build-args
  HOST_UID: "${HOST_UID:-1000}"
  HOST_GID: "${HOST_GID:-1000}"
  PI_VERSION: "${PI_VERSION:-1.2.0}"
  DOCKER_HASH: "${DOCKER_HASH:-}"

services:
  general:
    <<: *hardening
    image: pi-sandbox:general
    build:
      context: .
      dockerfile: docker/Dockerfile.base
      args:
        <<: *build-args
    volumes:
      - "${SANDBOX_WORKDIR:?SANDBOX_WORKDIR must point at the repo to mount}:/workspace"
      - "./pi-home:/opt/pi-home:ro"
      - "${PI_SANDBOX_GIT_HOME:?PI_SANDBOX_GIT_HOME must point at the host git home}/.gitconfig:/home/pi/.gitconfig:ro"
      - "${PI_SANDBOX_GIT_HOME:?PI_SANDBOX_GIT_HOME must point at the host git home}/.config/git:/home/pi/.config/git:ro"
      - "pi-home-general:/home/pi/.pi/agent"
      - "mise-data-general:/home/pi/.local/share/mise"

  web:
    <<: *hardening
    image: pi-sandbox:web
    build:
      context: .
      dockerfile: docker/Dockerfile.web
      args:
        <<: *build-args
    volumes:
      - "${SANDBOX_WORKDIR:?SANDBOX_WORKDIR must point at the repo to mount}:/workspace"
      - "./pi-home:/opt/pi-home:ro"
      - "${PI_SANDBOX_GIT_HOME:?PI_SANDBOX_GIT_HOME must point at the host git home}/.gitconfig:/home/pi/.gitconfig:ro"
      - "${PI_SANDBOX_GIT_HOME:?PI_SANDBOX_GIT_HOME must point at the host git home}/.config/git:/home/pi/.config/git:ro"
      - "pi-home-web:/home/pi/.pi/agent"
      - "mise-data-web:/home/pi/.local/share/mise"
      - "pw-browsers:/opt/pw-browsers"

  android:
    <<: *hardening
    image: pi-sandbox:android
    build:
      context: .
      dockerfile: docker/Dockerfile.android
      args:
        <<: *build-args
    environment:
      PI_SANDBOX_AVD_NAME: "${PI_SANDBOX_AVD_NAME:-pixel_6_api_34}"
      PI_SANDBOX_ANDROID_SYSTEM_IMAGE: "${PI_SANDBOX_ANDROID_SYSTEM_IMAGE:-system-images;android-34;google_apis;x86_64}"
    devices: ["/dev/kvm"]
    group_add: ["${KVM_GID:-0}"]
    volumes:
      - "${SANDBOX_WORKDIR:?SANDBOX_WORKDIR must point at the repo to mount}:/workspace"
      - "${PI_SANDBOX_ANDROID_SDK:?PI_SANDBOX_ANDROID_SDK must point at the host Android SDK}:/opt/android-sdk:ro"
      - "./pi-home:/opt/pi-home:ro"
      - "${PI_SANDBOX_GIT_HOME:?PI_SANDBOX_GIT_HOME must point at the host git home}/.gitconfig:/home/pi/.gitconfig:ro"
      - "${PI_SANDBOX_GIT_HOME:?PI_SANDBOX_GIT_HOME must point at the host git home}/.config/git:/home/pi/.config/git:ro"
      - "pi-home-android:/home/pi/.pi/agent"
      - "mise-data-android:/home/pi/.local/share/mise"
      - "gradle-cache:/home/pi/.gradle"

volumes:
  pi-home-general:
  pi-home-web:
  pi-home-android:
  mise-data-general:
  mise-data-web:
  mise-data-android:
  pw-browsers:
  gradle-cache:
